<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0310"/>
      <stop offset="50%" stop-color="#190620"/>
      <stop offset="100%" stop-color="#08020a"/>
    </linearGradient>
    <linearGradient id="lens-streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="25%" stop-color="rgba(255, 42, 133, 0.4)"/>
      <stop offset="50%" stop-color="rgba(0, 245, 255, 0.9)"/>
      <stop offset="75%" stop-color="rgba(255, 42, 133, 0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="ad-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <rect width="600" height="480" fill="url(#ad-bg)"/>

  <!-- Cinema Studio Ambient Lighting -->
  <circle cx="300" cy="220" r="180" fill="#ff2a85" opacity="0.25" filter="url(#ad-glow)"/>
  <circle cx="460" cy="160" r="140" fill="#00f5ff" opacity="0.2" filter="url(#ad-glow)"/>

  <!-- CINEMA 16:9 VIDEO PLAYER MONITOR FRAME -->
  <g transform="translate(40, 35)">
    <rect width="520" height="340" rx="14" fill="#120518" stroke="rgba(255, 42, 133, 0.4)" stroke-width="1.5" filter="drop-shadow(0 18px 36px rgba(0,0,0,0.8))"/>

    <!-- Anamorphic Lens Flare Horizontal Beam -->
    <rect x="20" y="160" width="480" height="18" fill="url(#lens-streak)"/>

    <!-- Studio Camera Viewfinder Grid -->
    <line x1="260" y1="12" x2="260" y2="330" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>
    <line x1="12" y1="170" x2="510" y2="170" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>

    <!-- Top Telemetry & Recording Status Bar -->
    <g transform="translate(24, 18)">
      <circle cx="10" cy="10" r="5" fill="#ef4444"/>
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff4d4f">&#9679; REC [4K 60FPS]</text>
      <text x="360" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c0d4ec">TC 00:02:14:08</text>
    </g>

    <!-- 3D PRODUCT COMMERCIAL SPOTLIGHT STAGE -->
    <!-- Pedestal Base -->
    <ellipse cx="260" cy="265" rx="125" ry="24" fill="rgba(0,0,0,0.7)"/>
    <ellipse cx="260" cy="258" rx="100" ry="18" fill="#1f0a2a" stroke="rgba(255, 42, 133, 0.6)" stroke-width="1.2"/>

    <!-- Luxury Product Bottle Render (Perfume / Premium Beverage) -->
    <g transform="translate(260, 185)">
      <!-- Product Glow Halo -->
      <circle cx="0" cy="-18" r="55" fill="#ff2a85" opacity="0.45" filter="url(#ad-glow)"/>
      <circle cx="0" cy="-18" r="30" fill="#00f5ff" opacity="0.3" filter="url(#ad-glow)"/>

      <!-- Bottle Glass Body -->
      <rect x="-34" y="-55" width="68" height="100" rx="12" fill="linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,42,133,0.35) 50%, rgba(12,3,16,0.92))" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

      <!-- Gold Neck & Cap -->
      <rect x="-12" y="-76" width="24" height="22" rx="4" fill="linear-gradient(135deg, #fff4bf, #c89243)"/>

      <!-- Bottle Label -->
      <rect x="-24" y="-25" width="48" height="44" rx="5" fill="#0f0314" stroke="rgba(226, 183, 116, 0.6)" stroke-width="1"/>
      <text x="0" y="-6" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#e2b774" text-anchor="middle">OPULENCE</text>
      <text x="0" y="6" font-family="sans-serif" font-size="5" fill="#ffb3c7" text-anchor="middle">AI COMMERCIAL</text>
      <circle cx="0" cy="12" r="1.8" fill="#ff2a85"/>
    </g>

    <!-- Floating Circular Play Button Badge -->
    <g transform="translate(260, 115)">
      <circle cx="0" cy="0" r="28" fill="rgba(255, 42, 133, 0.9)" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0 6px 14px rgba(255,42,133,0.6))"/>
      <polygon points="-6,-11 -6,11 13,0" fill="#ffffff"/>
    </g>

    <!-- Video Timeline & Audio Scrub Bar -->
    <g transform="translate(24, 290)">
      <rect width="472" height="38" rx="8" fill="#0d0312" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Audio Waveform Bars -->
      <g fill="#ff2a85" opacity="0.65" transform="translate(18, 19)">
        <rect x="0" y="-9" width="3" height="18" rx="1"/>
        <rect x="7" y="-14" width="3" height="28" rx="1"/>
        <rect x="14" y="-6" width="3" height="12" rx="1"/>
        <rect x="21" y="-16" width="3" height="32" rx="1"/>
        <rect x="28" y="-11" width="3" height="22" rx="1"/>
        <rect x="35" y="-8" width="3" height="16" rx="1"/>
        <rect x="42" y="-15" width="3" height="30" rx="1"/>
        <rect x="49" y="-5" width="3" height="10" rx="1"/>
      </g>

      <!-- Scrub Track & Scrubber Head -->
      <line x1="85" y1="19" x2="445" y2="19" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="85" y1="19" x2="270" y2="19" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="270" cy="19" r="6" fill="#00f5ff" stroke="#ffffff" stroke-width="2"/>
      <text x="380" y="23" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00f5ff">00:45 / 01:30</text>
    </g>
  </g>

  <!-- BOTTOM CAMPAIGN FORMAT TAGS & AD SPECS -->
  <g transform="translate(40, 395)">
    <rect width="520" height="65" rx="10" fill="#14061a" stroke="rgba(255, 42, 133, 0.3)" stroke-width="1"/>
    <g transform="translate(18, 20)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#ffb3c7">PRODUCTION SPECIFICATIONS:</text>
      <!-- 3 Campaign Format Badges -->
      <g transform="translate(0, 22)">
        <rect width="145" height="20" rx="10" fill="rgba(255, 42, 133, 0.18)" stroke="#ff2a85" stroke-width="1"/>
        <text x="10" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#ffb3c7">&#9679; AI PRODUCT VIDEO</text>

        <rect x="155" y="0" width="165" height="20" rx="10" fill="rgba(0, 245, 255, 0.15)" stroke="#00f5ff" stroke-width="1"/>
        <text x="165" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#b4f5fc">&#9679; 3D SOCIAL COMMERCIALS</text>

        <rect x="330" y="0" width="140" height="20" rx="10" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
        <text x="340" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#e9d5ff">&#9679; 4K HIGH CONVERTING</text>
      </g>
    </g>
  </g>
</svg>