<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0312"/>
      <stop offset="50%" stop-color="#1c0724"/>
      <stop offset="100%" stop-color="#08020b"/>
    </linearGradient>
    <linearGradient id="lens-flare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="rgba(255, 42, 133, 0.4)"/>
      <stop offset="50%" stop-color="rgba(0, 245, 255, 0.8)"/>
      <stop offset="70%" stop-color="rgba(255, 42, 133, 0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="ad-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#ad-bg)"/>

  <!-- Ambient Cinema Lighting -->
  <circle cx="300" cy="180" r="150" fill="#ff2a85" opacity="0.22" filter="url(#ad-blur)"/>
  <circle cx="450" cy="130" r="100" fill="#00f5ff" opacity="0.18" filter="url(#ad-blur)"/>

  <!-- 16:9 Cinema Framed Stage -->
  <g transform="translate(45, 25)">
    <rect width="510" height="330" rx="14" fill="#110517" stroke="rgba(255, 42, 133, 0.35)" stroke-width="1.2"/>

    <!-- Studio Camera Grid &amp; Crosshairs -->
    <line x1="255" y1="10" x2="255" y2="320" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>
    <line x1="10" y1="165" x2="500" y2="165" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4"/>

    <!-- Anamorphic Light Streak -->
    <rect x="20" y="155" width="470" height="16" fill="url(#lens-flare)"/>

    <!-- Central 3D Product Pedestal &amp; Spotlight -->
    <ellipse cx="255" cy="240" rx="110" ry="22" fill="rgba(0,0,0,0.6)"/>
    <ellipse cx="255" cy="234" rx="90" ry="16" fill="#1e0c28" stroke="rgba(255, 42, 133, 0.5)" stroke-width="1"/>

    <!-- Minimalist Luxury Perfume / Beverage Bottle 3D Render -->
    <g transform="translate(255, 175)">
      <!-- Glow aura behind bottle -->
      <circle cx="0" cy="-15" r="45" fill="#ff2a85" opacity="0.4" filter="url(#ad-blur)"/>
      <!-- Bottle Body -->
      <rect x="-28" y="-45" width="56" height="82" rx="10" fill="#240c2a" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      <!-- Gold Neck &amp; Cap -->
      <rect x="-10" y="-62" width="20" height="17" rx="3" fill="#e0a96d"/>
      <!-- Bottle Label -->
      <rect x="-20" y="-20" width="40" height="36" rx="4" fill="#0e0412" stroke="rgba(224,169,109,0.5)" stroke-width="0.8"/>
      <text x="0" y="-4" font-family="'Cinzel', serif" font-size="6.5" font-weight="700" fill="#e0a96d" text-anchor="middle">OPULENCE</text>
      <text x="0" y="6" font-family="sans-serif" font-size="4.5" fill="#ffb3c7" text-anchor="middle">EAU DE PARFUM</text>
      <circle cx="0" cy="10" r="1.5" fill="#ff2a85"/>
    </g>

    <!-- Top Telemetry &amp; Recording Bar -->
    <g transform="translate(20, 16)">
      <circle cx="10" cy="10" r="5" fill="#ff2a85"/>
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ff2a85">&#9679; REC [4K HDR]</text>
      <text x="380" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#c0d0dc">00:01:24:18</text>
    </g>

    <!-- Floating Play Button Badge with Glow -->
    <g transform="translate(255, 115)">
      <circle cx="0" cy="0" r="26" fill="rgba(255, 42, 133, 0.85)" stroke="#ffffff" stroke-width="2"/>
      <polygon points="-5,-10 -5,10 11,0" fill="#ffffff"/>
    </g>

    <!-- Bottom Timeline Scrubber -->
    <g transform="translate(24, 275)">
      <rect width="462" height="38" rx="8" fill="#0d0312" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Scrubber Line &amp; Playhead -->
      <line x1="24" y1="19" x2="430" y2="19" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="19" x2="240" y2="19" stroke="#00f5ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="240" cy="19" r="5" fill="#00f5ff" stroke="#ffffff" stroke-width="1.5"/>
      <text x="370" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a892a4">AI MOTION &#183; 60FPS</text>
    </g>
  </g>
</svg>