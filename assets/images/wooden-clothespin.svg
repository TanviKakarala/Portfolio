<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 90" width="40" height="90">
  <defs>
    <!-- Realistic Wood Grain Gradients -->
    <linearGradient id="woodFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b68953"/>
      <stop offset="18%" stop-color="#d9af7a"/>
      <stop offset="45%" stop-color="#e8c798"/>
      <stop offset="75%" stop-color="#c99d66"/>
      <stop offset="100%" stop-color="#936836"/>
    </linearGradient>
    <linearGradient id="woodBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2dcba"/>
      <stop offset="50%" stop-color="#caa06b"/>
      <stop offset="100%" stop-color="#7a4f1e"/>
    </linearGradient>
    <linearGradient id="springMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6edf2"/>
      <stop offset="35%" stop-color="#9aa4af"/>
      <stop offset="70%" stop-color="#5a6572"/>
      <stop offset="100%" stop-color="#2a323c"/>
    </linearGradient>
    <filter id="pegShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
  </defs>

  <g filter="url(#pegShadow)">
    <!-- Back Jaw / Wood Underlayer -->
    <rect x="13" y="10" width="14" height="70" rx="2" fill="#7d5325"/>

    <!-- Left Lever (Top Prong) -->
    <path d="M 13,10 L 19,10 L 19,38 L 13,38 Z" fill="url(#woodFront)"/>
    <line x1="13" y1="10" x2="13" y2="38" stroke="#f0d8b5" stroke-width="0.8"/>
    <line x1="19" y1="10" x2="19" y2="38" stroke="#6e461b" stroke-width="0.8"/>

    <!-- Right Lever (Top Prong) -->
    <path d="M 21,10 L 27,10 L 27,38 L 21,38 Z" fill="url(#woodFront)"/>
    <line x1="21" y1="10" x2="21" y2="38" stroke="#f0d8b5" stroke-width="0.8"/>
    <line x1="27" y1="10" x2="27" y2="38" stroke="#6e461b" stroke-width="0.8"/>

    <!-- Center Fulcrum Notch Depth -->
    <rect x="12" y="38" width="16" height="12" rx="1" fill="#4d3012"/>

    <!-- Steel Wire Spring Ring Clamping Center -->
    <!-- Spring Body Coil -->
    <rect x="10" y="40" width="20" height="8" rx="4" fill="url(#springMetal)" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Spring Center Tension Eyelet -->
    <ellipse cx="20" cy="44" rx="4" ry="2.5" fill="#1b2026"/>
    <ellipse cx="20" cy="44" rx="2.5" ry="1.5" fill="#808d9b"/>

    <!-- Spring Leg Wire Tension Arms -->
    <path d="M 12,41 L 12,28" stroke="url(#springMetal)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 28,47 L 28,62" stroke="url(#springMetal)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Front Clamping Jaw (Overhanging Rope and Card) -->
    <rect x="12" y="50" width="16" height="30" rx="2.5" fill="url(#woodFront)"/>
    <!-- Wood grain subtle lines on front jaw -->
    <line x1="15" y1="52" x2="15" y2="78" stroke="rgba(100,50,10,0.18)" stroke-width="0.8"/>
    <line x1="22" y1="54" x2="22" y2="77" stroke="rgba(100,50,10,0.18)" stroke-width="0.8"/>
    <line x1="25" y1="51" x2="25" y2="79" stroke="rgba(100,50,10,0.15)" stroke-width="0.8"/>
    
    <!-- Top and Bottom Bevel Glints -->
    <line x1="13" y1="51" x2="27" y2="51" stroke="#f5e1c4" stroke-width="1"/>
    <line x1="13" y1="79" x2="27" y2="79" stroke="#6e461b" stroke-width="1.2"/>
  </g>
</svg>