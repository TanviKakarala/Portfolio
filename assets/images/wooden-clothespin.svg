<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 124" width="54" height="124">
  <defs>
    <!-- Realistic Birch / Pine Wood Textures -->
    <linearGradient id="birchFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e6cc"/>
      <stop offset="15%" stop-color="#ecd4ad"/>
      <stop offset="45%" stop-color="#dfbe88"/>
      <stop offset="78%" stop-color="#cfab72"/>
      <stop offset="100%" stop-color="#a88147"/>
    </linearGradient>

    <linearGradient id="birchShadowSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a88147"/>
      <stop offset="50%" stop-color="#8c6731"/>
      <stop offset="100%" stop-color="#63451b"/>
    </linearGradient>

    <linearGradient id="birchBevelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#f7e8ce"/>
      <stop offset="100%" stop-color="#ecd4ad"/>
    </linearGradient>

    <linearGradient id="backWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c6731"/>
      <stop offset="60%" stop-color="#6b4b1e"/>
      <stop offset="100%" stop-color="#4f3411"/>
    </linearGradient>

    <!-- Spring Steel Wire Gradient -->
    <linearGradient id="springWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d0d6dd"/>
      <stop offset="55%" stop-color="#7e8793"/>
      <stop offset="85%" stop-color="#424a54"/>
      <stop offset="100%" stop-color="#20252b"/>
    </linearGradient>

    <!-- Deep Contact & Drop Shadows -->
    <filter id="pinSoftShadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
    <filter id="pinCardContact" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="rgba(0,0,0,0.75)"/>
    </filter>
  </defs>

  <g filter="url(#pinSoftShadow)">
    <!-- 1. BACK WOOD PIECE -->
    <rect x="16" y="8" width="22" height="102" rx="2.5" fill="url(#backWood)"/>

    <!-- 2. STEEL TORSION SPRING WIRE -->
    <g>
      <rect x="12" y="46" width="30" height="12" rx="5" fill="#1c2024"/>
      <rect x="13" y="47" width="28" height="10" rx="4.5" fill="url(#springWire)"/>
      <ellipse cx="27" cy="52" rx="5" ry="3" fill="#111417"/>
      <ellipse cx="27" cy="52" rx="3.5" ry="1.8" fill="#9da6b2"/>
      <path d="M 15,48 L 15,32" stroke="url(#springWire)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 39,56 L 39,74" stroke="url(#springWire)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 3. TOP PINCH LEVERS (Left & Right Prongs) -->
    <!-- Left Lever -->
    <g>
      <rect x="16" y="8" width="10" height="40" rx="1.5" fill="url(#birchFront)"/>
      <path d="M 16,10 L 17.5,8 L 24.5,8 L 26,10 Z" fill="url(#birchBevelTop)"/>
      <line x1="16.5" y1="10" x2="16.5" y2="47" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"/>
      <line x1="25.5" y1="9" x2="25.5" y2="47" stroke="rgba(80,48,15,0.45)" stroke-width="0.8"/>
      <line x1="19" y1="12" x2="19" y2="45" stroke="rgba(130,80,25,0.18)" stroke-width="0.6" stroke-dasharray="12 4 8"/>
      <line x1="22" y1="10" x2="22" y2="46" stroke="rgba(130,80,25,0.14)" stroke-width="0.5" stroke-dasharray="6 3 14"/>
    </g>

    <!-- Right Lever -->
    <g>
      <rect x="28" y="8" width="10" height="40" rx="1.5" fill="url(#birchFront)"/>
      <path d="M 28,10 L 29.5,8 L 36.5,8 L 38,10 Z" fill="url(#birchBevelTop)"/>
      <line x1="28.5" y1="10" x2="28.5" y2="47" stroke="rgba(255,255,255,0.65)" stroke-width="0.8"/>
      <line x1="37.5" y1="9" x2="37.5" y2="47" stroke="rgba(70,40,10,0.65)" stroke-width="0.9"/>
      <line x1="31" y1="11" x2="31" y2="46" stroke="rgba(130,80,25,0.16)" stroke-width="0.6" stroke-dasharray="10 5 10"/>
      <line x1="34.5" y1="9" x2="34.5" y2="45" stroke="rgba(130,80,25,0.15)" stroke-width="0.5" stroke-dasharray="8 4 12"/>
    </g>

    <!-- 4. MIDDLE FULCRUM NOTCH -->
    <rect x="15" y="47" width="24" height="8" rx="1" fill="#3d250c" opacity="0.85"/>
    <line x1="15" y1="47" x2="39" y2="47" stroke="#261605" stroke-width="1.2"/>
    <line x1="15" y1="55" x2="39" y2="55" stroke="rgba(255,255,255,0.45)" stroke-width="0.8"/>

    <!-- 5. FRONT CLAMPING JAW -->
    <g filter="url(#pinCardContact)">
      <rect x="15" y="55" width="24" height="55" rx="2" fill="url(#birchFront)"/>
      <path d="M 37,55 L 39,57 L 39,108 L 37,110 Z" fill="url(#birchShadowSide)"/>
      <line x1="15" y1="55.5" x2="37" y2="55.5" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
      <line x1="16" y1="109" x2="37" y2="109" stroke="#f5e1c4" stroke-width="0.8"/>
      <line x1="15" y1="110" x2="39" y2="110" stroke="#52320f" stroke-width="1.5"/>
      <line x1="15.5" y1="56" x2="15.5" y2="109" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>

      <!-- Authentic Wood Grain Lines -->
      <line x1="18" y1="57" x2="18" y2="108" stroke="rgba(120,70,20,0.18)" stroke-width="0.7" stroke-dasharray="14 5 18"/>
      <line x1="21.5" y1="56" x2="21.5" y2="107" stroke="rgba(120,70,20,0.14)" stroke-width="0.5" stroke-dasharray="20 6 10"/>
      <line x1="25" y1="58" x2="25" y2="108" stroke="rgba(120,70,20,0.22)" stroke-width="0.8" stroke-dasharray="16 4 12"/>
      <line x1="29" y1="56" x2="29" y2="107" stroke="rgba(120,70,20,0.15)" stroke-width="0.6" stroke-dasharray="10 4 22"/>
      <line x1="33" y1="57" x2="33" y2="108" stroke="rgba(120,70,20,0.18)" stroke-width="0.6" stroke-dasharray="18 5 14"/>

      <!-- Natural Wood Knot / Fleck -->
      <ellipse cx="28" cy="82" rx="1.8" ry="1.2" fill="rgba(100,55,15,0.35)"/>
      <ellipse cx="28" cy="82" rx="0.9" ry="0.6" fill="rgba(70,35,10,0.5)"/>
    </g>
  </g>
</svg>