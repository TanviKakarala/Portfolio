<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0512"/>
      <stop offset="60%" stop-color="#18081f"/>
      <stop offset="100%" stop-color="#0a030d"/>
    </linearGradient>
    <linearGradient id="web-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="web-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#web-bg)"/>

  <!-- Ambient Underglow -->
  <circle cx="300" cy="200" r="160" fill="#ff2a85" opacity="0.18" filter="url(#web-blur)"/>
  <circle cx="460" cy="140" r="100" fill="#00f5ff" opacity="0.14" filter="url(#web-blur)"/>

  <!-- Tech Grid Background Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
  </g>

  <!-- Main Floating Glass Browser Window -->
  <g transform="translate(45, 30)">
    <!-- Window Shadow &amp; Shell -->
    <rect width="510" height="320" rx="14" fill="#120718" stroke="rgba(255, 42, 133, 0.35)" stroke-width="1.2"/>
    <!-- Glass Top Chrome Bar -->
    <rect width="510" height="38" rx="14" fill="#1c0c24"/>
    <rect y="30" width="510" height="8" fill="#1c0c24"/>
    <line x1="0" y1="38" x2="510" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="22" cy="19" r="5" fill="#ff4d4f"/>
    <circle cx="38" cy="19" r="5" fill="#faad14"/>
    <circle cx="54" cy="19" r="5" fill="#52c41a"/>

    <!-- URL Pill Bar -->
    <rect x="82" y="8" width="280" height="22" rx="6" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="96" cy="19" r="3" fill="#00f5ff"/>
    <text x="108" y="23" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#e0c4d8">https://opulence-global.com <tspan fill="#00f5ff">&#9679; LIVE</tspan></text>

    <!-- Header Navigation Mockup -->
    <g transform="translate(24, 52)">
      <rect width="462" height="44" rx="8" fill="url(#card-glass)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <!-- Brand Logo in Window -->
      <circle cx="24" cy="22" r="10" fill="url(#web-glow)"/>
      <text x="44" y="26" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1.5">OPULENCE</text>

      <text x="260" y="25" font-family="system-ui, sans-serif" font-size="10.5" fill="#a892a4">Collections</text>
      <text x="340" y="25" font-family="system-ui, sans-serif" font-size="10.5" fill="#a892a4">Experience</text>
      <rect x="410" y="11" width="42" height="22" rx="11" fill="rgba(255,42,133,0.3)" stroke="#ff2a85" stroke-width="1"/>
      <text x="422" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#fff">LIVE</text>
    </g>

    <!-- Hero Content Banner -->
    <g transform="translate(24, 108)">
      <rect width="462" height="128" rx="10" fill="#190a22" stroke="rgba(255,42,133,0.2)" stroke-width="1"/>
      <!-- Hero Headline Text -->
      <text x="24" y="38" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="800" fill="#ffffff">Bespoke Digital Storefront</text>
      <text x="24" y="60" font-family="system-ui, sans-serif" font-size="11.5" fill="#ffb3c7">Sub-second loads &#183; Custom 3D Motion &#183; High Conversion UI</text>

      <!-- Mini Metric Cards -->
      <g transform="translate(24, 76)">
        <rect width="126" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1"/>
        <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00f5ff">99.8%</text>
        <text x="68" y="23" font-family="system-ui, sans-serif" font-size="9" fill="#c0d0dc">PageSpeed</text>
      </g>

      <g transform="translate(160, 76)">
        <rect width="126" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255, 42, 133, 0.4)" stroke-width="1"/>
        <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ff2a85">0.38s</text>
        <text x="62" y="23" font-family="system-ui, sans-serif" font-size="9" fill="#e0c0d0">Core LCP</text>
      </g>

      <g transform="translate(296, 76)">
        <rect width="142" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(157, 78, 221, 0.4)" stroke-width="1"/>
        <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#c77dff">100%</text>
        <text x="62" y="23" font-family="system-ui, sans-serif" font-size="9" fill="#d8c0e8">Fluid Viewport</text>
      </g>
    </g>

    <!-- Bottom Code Status Bar -->
    <g transform="translate(24, 248)">
      <rect width="462" height="58" rx="8" fill="#0e0412" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff2a85">const <tspan fill="#00f5ff">storefront</tspan> = new WebExperience({</text>
      <text x="34" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a890a2">engine: <tspan fill="#ffd166">'GSAP 3D'</tspan>, architecture: <tspan fill="#ffd166">'Edge CDN'</tspan>, converted: <tspan fill="#00f5ff">true</tspan> });</text>
    </g>
  </g>
</svg>