<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0410"/>
      <stop offset="60%" stop-color="#180720"/>
      <stop offset="100%" stop-color="#08020b"/>
    </linearGradient>
    <linearGradient id="cyan-pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <linearGradient id="screen-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="40%" stop-color="transparent"/>
    </linearGradient>
    <filter id="wd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <rect width="600" height="480" fill="url(#wd-bg)"/>

  <!-- Ambient Ethereal Glow -->
  <circle cx="280" cy="220" r="180" fill="#ff2a85" opacity="0.2" filter="url(#wd-glow)"/>
  <circle cx="440" cy="160" r="130" fill="#00f5ff" opacity="0.18" filter="url(#wd-glow)"/>

  <!-- Subtle Perspective Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="380" x2="600" y2="380"/>
    <line x1="150" y1="0" x2="150" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/>
  </g>

  <!-- LAPTOP SCREEN MOCKUP (Desktop Storefront) -->
  <g transform="translate(40, 45)">
    <!-- Laptop Chassis -->
    <rect width="420" height="270" rx="12" fill="#14081b" stroke="rgba(255, 42, 133, 0.4)" stroke-width="1.5"/>
    <rect width="420" height="28" rx="12" fill="#1e0c28"/>
    <rect y="20" width="420" height="8" fill="#1e0c28"/>
    <line x1="0" y1="28" x2="420" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="18" cy="14" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="14" r="4.5" fill="#f59e0b"/>
    <circle cx="46" cy="14" r="4.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="70" y="6" width="220" height="16" rx="5" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="80" cy="14" r="2.5" fill="#00f5ff"/>
    <text x="90" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ffd5e0">opulence-trading.com <tspan fill="#00f5ff">&#9679; LIVE</tspan></text>

    <!-- Laptop Content: OPULENCE Storefront Hero -->
    <g transform="translate(18, 40)">
      <!-- Navbar inside site -->
      <text x="6" y="16" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">OPULENCE</text>
      <text x="180" y="15" font-family="system-ui, sans-serif" font-size="8.5" fill="#c4b0c0">Commodities</text>
      <text x="245" y="15" font-family="system-ui, sans-serif" font-size="8.5" fill="#c4b0c0">Global Trade</text>
      <rect x="315" y="4" width="62" height="18" rx="9" fill="rgba(255,42,133,0.3)" stroke="#ff2a85" stroke-width="1"/>
      <text x="327" y="16" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#fff">Inquire &#8594;</text>

      <!-- Hero Banner -->
      <g transform="translate(0, 30)">
        <rect width="384" height="110" rx="8" fill="#1a0a24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="16" y="32" font-family="'Cinzel', serif" font-size="17" font-weight="800" fill="#ffffff">Global Commodity Trading</text>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffb3c7">Bespoke, High-Conversion Storefront &#183; Sub-Second Global Edge</text>

        <!-- Product Cards Row -->
        <g transform="translate(16, 62)">
          <rect width="105" height="36" rx="5" fill="#0f0514" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1"/>
          <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00f5ff">0.38s LCP</text>
          <text x="10" y="29" font-family="system-ui, sans-serif" font-size="7" fill="#b0c4de">Speed Score 99</text>

          <rect x="115" y="0" width="115" height="36" rx="5" fill="#0f0514" stroke="rgba(255, 42, 133, 0.4)" stroke-width="1"/>
          <text x="125" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ff2a85">100% Fluid</text>
          <text x="125" y="29" font-family="system-ui, sans-serif" font-size="7" fill="#e2b8cb">Responsive UI</text>

          <rect x="240" y="0" width="112" height="36" rx="5" fill="#0f0514" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
          <text x="250" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c084fc">Netlify Live</text>
          <text x="250" y="29" font-family="system-ui, sans-serif" font-size="7" fill="#d8b4e2">Edge Deployment</text>
        </g>
      </g>

      <!-- Bottom Status Code Tag -->
      <g transform="translate(0, 150)">
        <rect width="384" height="38" rx="6" fill="#0a030d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ff2a85">const <tspan fill="#00f5ff">storefront</tspan> = new WebExperience({</text>
        <text x="28" y="30" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a892a4">stack: <tspan fill="#ffd166">'HTML5 / GSAP / Edge CDN'</tspan>, converts: <tspan fill="#00f5ff">true</tspan> });</text>
      </g>
    </g>

    <!-- Laptop Base / Stand -->
    <path d="M -30,270 L 450,270 L 430,278 L -10,278 Z" fill="#24102c" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  </g>

  <!-- MOBILE DEVICE MOCKUP (Overlapping Right Foreground) -->
  <g transform="translate(390, 130)">
    <!-- Phone Chassis with Shadow -->
    <rect width="170" height="320" rx="24" fill="#180720" stroke="url(#cyan-pink-grad)" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <!-- Speaker / Dynamic Island Notch -->
    <rect x="55" y="8" width="60" height="12" rx="6" fill="#000000"/>
    <circle cx="102" cy="14" r="2.5" fill="#00f5ff"/>

    <!-- Screen Content -->
    <g transform="translate(10, 28)">
      <rect width="150" height="280" rx="16" fill="#0d0411"/>
      <!-- Mobile Nav -->
      <circle cx="16" cy="18" r="8" fill="url(#cyan-pink-grad)"/>
      <text x="32" y="21" font-family="'Cinzel', serif" font-size="9" font-weight="700" fill="#fff">OPULENCE</text>
      <line x1="126" y1="15" x2="140" y2="15" stroke="#fff" stroke-width="1.5"/>
      <line x1="126" y1="20" x2="140" y2="20" stroke="#fff" stroke-width="1.5"/>

      <!-- Mobile Hero Card -->
      <rect x="8" y="36" width="134" height="85" rx="8" fill="#1f0928" stroke="rgba(255,42,133,0.3)"/>
      <text x="16" y="56" font-family="'Cinzel', serif" font-size="10.5" font-weight="700" fill="#fff">Luxury Trade</text>
      <text x="16" y="70" font-family="system-ui, sans-serif" font-size="7.5" fill="#fbcfe8">Interactive 3D Catalog</text>
      <rect x="16" y="82" width="68" height="16" rx="8" fill="#ff2a85"/>
      <text x="25" y="93" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#fff">Explore &#8594;</text>

      <!-- Mobile Metric Pills -->
      <rect x="8" y="132" width="134" height="32" rx="6" fill="#14061a" stroke="rgba(0, 245, 255, 0.3)"/>
      <text x="16" y="148" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00f5ff">&#9889; 100% Mobile UI</text>
      <text x="16" y="158" font-family="system-ui, sans-serif" font-size="6.5" fill="#a0b8cc">Optimized Touch &amp; Gestures</text>

      <rect x="8" y="172" width="134" height="32" rx="6" fill="#14061a" stroke="rgba(255, 42, 133, 0.3)"/>
      <text x="16" y="188" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ff2a85">&#9733; 0.4s Fast Load</text>
      <text x="16" y="198" font-family="system-ui, sans-serif" font-size="6.5" fill="#d8b2c4">SEO &amp; High Conversion</text>

      <!-- Floating Indicator Badge -->
      <rect x="8" y="214" width="134" height="24" rx="12" fill="rgba(0, 245, 255, 0.15)" stroke="#00f5ff" stroke-width="1"/>
      <text x="22" y="229" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#00f5ff">&#9679; CLIENT PRODUCTION</text>
    </g>
  </g>
</svg>