<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser Window Mockup -->
  <g filter="url(#card-shadow)" transform="translate(60, 45)">
    <!-- Browser Header -->
    <rect width="680" height="410" rx="14" fill="#0c1222" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect width="680" height="42" rx="14" fill="#141c30"/>
    <!-- Window controls -->
    <circle cx="25" cy="21" r="6" fill="#ef4444"/>
    <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="21" r="6" fill="#10b981"/>
    <!-- URL Bar -->
    <rect x="110" y="9" width="460" height="24" rx="6" fill="#080c18" stroke="rgba(255,255,255,0.08)"/>
    <text x="125" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">https://opulence-global.com <tspan fill="#10b981">● LIVE</tspan></text>

    <!-- Website Hero Content -->
    <g transform="translate(40, 75)">
      <!-- Badge -->
      <rect x="0" y="0" width="165" height="24" rx="12" fill="rgba(234, 179, 8, 0.15)" stroke="url(#gold-grad)" stroke-width="1"/>
      <text x="12" y="16" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#facc15">INTERNATIONAL EXPORT</text>
      
      <!-- Headline -->
      <text x="0" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">OPULENCE TRADING</text>
      <text x="0" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#cbd5e1" font-weight="400">Global Trade Excellence &amp; Cross-Border Export Solutions</text>

      <!-- CTA Buttons -->
      <rect x="0" y="125" width="150" height="38" rx="8" fill="url(#gold-grad)"/>
      <text x="28" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#000000">Explore Catalog</text>
      <rect x="165" y="125" width="140" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
      <text x="195" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Watch Story</text>

      <!-- Key Metric Cards -->
      <g transform="translate(0, 195)">
        <rect x="0" y="0" width="180" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
        <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="url(#accent-blue)">50+ Ports</text>
        <text x="18" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Global Logistics Network</text>
        
        <rect x="195" y="0" width="180" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
        <text x="213" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#facc15">100% Quality</text>
        <text x="213" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Verified Certification</text>
      </g>
    </g>

    <!-- Visual Graphic on Right of Mockup -->
    <g transform="translate(440, 75)">
      <rect width="200" height="280" rx="12" fill="#080c18" stroke="rgba(255,255,255,0.1)"/>
      <!-- Cargo ship & globe abstract graphic -->
      <circle cx="100" cy="110" r="70" fill="none" stroke="rgba(0, 245, 255, 0.2)" stroke-dasharray="4,4"/>
      <circle cx="100" cy="110" r="50" fill="none" stroke="rgba(234, 179, 8, 0.3)"/>
      <!-- Node points -->
      <circle cx="80" cy="90" r="5" fill="#00f5ff"/>
      <circle cx="120" cy="130" r="5" fill="#facc15"/>
      <line x1="80" y1="90" x2="120" y2="130" stroke="#00f5ff" stroke-width="2"/>
      <text x="100" y="225" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Interactive 3D Fleet</text>
      <text x="100" y="245" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AI Animated Showcase</text>
    </g>
  </g>
</svg>
