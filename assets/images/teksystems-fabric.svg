<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040916"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="tech-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#tech-bg)"/>

  <!-- Enterprise Architecture Diagram Container -->
  <g filter="url(#tech-shadow)" transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#060e1e" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1.2"/>
    
    <!-- Top Bar -->
    <rect width="680" height="42" rx="14" fill="#0b1730"/>
    <circle cx="25" cy="21" r="6" fill="#00f5ff"/>
    <text x="42" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">TEKSYSTEMS DATA INITIATIVE</text>
    <rect x="520" y="9" width="140" height="24" rx="12" fill="rgba(0, 245, 255, 0.1)" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="590" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#00f5ff" text-anchor="middle">Agentic AI Powered</text>

    <!-- Architecture flow: Source -> Fabric Medallion -> AI Validation -> Power BI -->
    <!-- Node 1: Legacy Sources -->
    <g transform="translate(35, 80)">
      <rect width="130" height="180" rx="10" fill="#081124" stroke="rgba(255,255,255,0.15)"/>
      <text x="65" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">SOURCE DATA</text>
      <rect x="15" y="50" width="100" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
      <text x="65" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">SQL Server / SSMS</text>
      <rect x="15" y="90" width="100" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
      <text x="65" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Legacy SSRS Reports</text>
      <rect x="15" y="130" width="100" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
      <text x="65" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Raw Schemas</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 175 170 L 205 170" stroke="#00f5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="190" y="158" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">ETL/ELT</text>

    <!-- Node 2: Microsoft Fabric Medallion Core -->
    <g transform="translate(215, 65)">
      <rect width="250" height="210" rx="12" fill="#07152f" stroke="url(#cyan-glow)" stroke-width="1.5"/>
      <text x="125" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00f5ff" text-anchor="middle">MICROSOFT FABRIC</text>
      
      <!-- Bronze, Silver, Gold Layers -->
      <rect x="20" y="45" width="210" height="40" rx="6" fill="rgba(205, 127, 50, 0.2)" stroke="#cd7f32" stroke-width="1"/>
      <text x="35" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fdba74">Bronze:</text>
      <text x="90" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#ffedd5">Ingestion &amp; Landing</text>

      <rect x="20" y="95" width="210" height="40" rx="6" fill="rgba(192, 192, 192, 0.2)" stroke="#c0c0c0" stroke-width="1"/>
      <text x="35" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Silver:</text>
      <text x="80" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f8fafc">PySpark Cleaning &amp; Rules</text>

      <rect x="20" y="145" width="210" height="40" rx="6" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308" stroke-width="1"/>
      <text x="35" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047">Gold:</text>
      <text x="75" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fef08a">Business Ready Marts</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 475 170 L 505 170" stroke="#00f5ff" stroke-width="2"/>

    <!-- Node 3: Target Insights -->
    <g transform="translate(515, 80)">
      <rect width="130" height="180" rx="10" fill="#081124" stroke="rgba(0, 245, 255, 0.4)"/>
      <text x="65" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#00f5ff" text-anchor="middle">MODERN BI</text>
      <rect x="15" y="50" width="100" height="30" rx="6" fill="rgba(0, 245, 255, 0.1)"/>
      <text x="65" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Power BI Modern</text>
      <rect x="15" y="90" width="100" height="30" rx="6" fill="rgba(0, 245, 255, 0.1)"/>
      <text x="65" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Tableau Analytics</text>
      <rect x="15" y="130" width="100" height="30" rx="6" fill="rgba(0, 245, 255, 0.1)"/>
      <text x="65" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">AI Data Insights</text>
    </g>

    <!-- Bottom Banner: Agentic AI Integration -->
    <g transform="translate(35, 290)">
      <rect width="610" height="90" rx="10" fill="rgba(0, 245, 255, 0.05)" stroke="rgba(0, 245, 255, 0.25)"/>
      <text x="25" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🤖 Agentic AI Modernization Pipeline</text>
      <text x="25" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Automated schema discovery, PySpark transformation scripts, and anomaly validation reducing migration turnaround by 60%.</text>
      <text x="25" y="75" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#00f5ff">Technologies: Python • PySpark • Microsoft Fabric • SQL • SSMS • Azure • Agentic AI</text>
    </g>
  </g>
</svg>
