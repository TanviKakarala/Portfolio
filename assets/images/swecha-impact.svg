<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="swecha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a20"/>
      <stop offset="50%" stop-color="#1f1035"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#swecha-grad)"/>

  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#0f071a" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect width="680" height="42" rx="14" fill="#190d2a"/>
    <circle cx="25" cy="21" r="6" fill="#ec4899"/>
    <text x="42" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">COMMUNITY LEADERSHIP &amp; OPEN SOURCE MOVEMENT</text>
    <rect x="520" y="9" width="140" height="24" rx="12" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="0.8"/>
    <text x="590" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">Swecha Volunteer</text>

    <!-- Key Impact Grid -->
    <!-- Col 1: University Technical Keynotes -->
    <g transform="translate(30, 65)">
      <rect width="295" height="185" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">🎓 University Workshops</text>
      <text x="20" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#cbd5e1">Delivered high-impact technical bootcamps at:</text>
      <text x="20" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f472b6" font-weight="600">• IARE &amp; MLRIT Hyderabad</text>
      <text x="20" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f472b6" font-weight="600">• CBIT &amp; MRIT Institutes</text>
      <text x="20" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f472b6" font-weight="600">• CMR Campuses &amp; Anurag University</text>
      <text x="20" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Subjects: Linux Admin, Full-Stack Web Dev, Code Hub, Web Scraping &amp; Data Ethics.</text>
      <rect x="20" y="155" width="255" height="20" rx="4" fill="rgba(139, 92, 246, 0.2)"/>
      <text x="147" y="169" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#c4b5fd" text-anchor="middle">GLUG Core Team Member &amp; Campaign Lead</text>
    </g>

    <!-- Col 2: Social Service & Govt School Education -->
    <g transform="translate(355, 65)">
      <rect width="295" height="185" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">🌱 Govt School Outreach</text>
      <text x="20" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#cbd5e1">Free tech education for underprivileged students:</text>
      <text x="20" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">• Installed Free Open-Source OS on school PCs</text>
      <text x="20" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">• Taught digital literacy &amp; computer basics</text>
      <text x="20" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">• Inspiring next-gen engineers from grassroots</text>
      <text x="20" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Equipped government school computers with Swecha educational software suites.</text>
      <rect x="20" y="155" width="255" height="20" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="147" y="169" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#7dd3fc" text-anchor="middle">Community Service &amp; Grassroots Empowerment</text>
    </g>

    <!-- Bottom Stat Banner -->
    <g transform="translate(30, 275)">
      <rect width="620" height="105" rx="10" fill="rgba(236, 72, 153, 0.05)" stroke="url(#purple-pink)" stroke-width="1"/>
      <g transform="translate(30, 25)">
        <text x="0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">1,000+</text>
        <text x="0" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Students Empowered</text>
      </g>
      <line x1="180" y1="20" x2="180" y2="85" stroke="rgba(255,255,255,0.1)"/>
      <g transform="translate(210, 25)">
        <text x="0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" fill="#f472b6">6+ Top</text>
        <text x="0" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Hyderabad Universities</text>
      </g>
      <line x1="390" y1="20" x2="390" y2="85" stroke="rgba(255,255,255,0.1)"/>
      <g transform="translate(420, 25)">
        <text x="0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">100% Free</text>
        <text x="0" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Open Source Movement</text>
      </g>
    </g>
  </g>
</svg>
