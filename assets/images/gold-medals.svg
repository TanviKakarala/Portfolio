<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141108"/>
      <stop offset="50%" stop-color="#241a05"/>
      <stop offset="100%" stop-color="#0d0901"/>
    </linearGradient>
    <linearGradient id="gold-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#medal-bg)"/>

  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#120e03" stroke="rgba(255, 215, 0, 0.35)" stroke-width="1.2"/>
    
    <!-- Top Ribbon -->
    <rect width="680" height="42" rx="14" fill="#201705"/>
    <circle cx="25" cy="21" r="6" fill="#ffd700"/>
    <text x="42" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffd700">ACADEMIC EXCELLENCE &amp; GOLD MEDAL HONORS</text>
    <rect x="500" y="9" width="160" height="24" rx="12" fill="rgba(255, 215, 0, 0.15)" stroke="#ffd700" stroke-width="0.8"/>
    <text x="580" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle">4× College Topper</text>

    <!-- 4 Medals Visual Representation -->
    <g transform="translate(60, 65)">
      <!-- Medal 1 -->
      <g transform="translate(0, 0)">
        <circle cx="50" cy="50" r="42" fill="url(#gold-shine)"/>
        <circle cx="50" cy="50" r="36" fill="#1c1404"/>
        <text x="50" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffd700" text-anchor="middle">🥇</text>
        <text x="50" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">YEAR 1</text>
        <text x="50" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">Gold Medal</text>
        <text x="50" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rank 1 Topper</text>
      </g>

      <!-- Medal 2 -->
      <g transform="translate(145, 0)">
        <circle cx="50" cy="50" r="42" fill="url(#gold-shine)"/>
        <circle cx="50" cy="50" r="36" fill="#1c1404"/>
        <text x="50" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffd700" text-anchor="middle">🥇</text>
        <text x="50" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">YEAR 2</text>
        <text x="50" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">Gold Medal</text>
        <text x="50" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rank 1 Topper</text>
      </g>

      <!-- Medal 3 -->
      <g transform="translate(290, 0)">
        <circle cx="50" cy="50" r="42" fill="url(#gold-shine)"/>
        <circle cx="50" cy="50" r="36" fill="#1c1404"/>
        <text x="50" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffd700" text-anchor="middle">🥇</text>
        <text x="50" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">YEAR 3</text>
        <text x="50" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">Gold Medal</text>
        <text x="50" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rank 1 Topper</text>
      </g>

      <!-- Medal 4 -->
      <g transform="translate(435, 0)">
        <circle cx="50" cy="50" r="42" fill="url(#gold-shine)"/>
        <circle cx="50" cy="50" r="36" fill="#1c1404"/>
        <text x="50" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffd700" text-anchor="middle">🥇</text>
        <text x="50" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">YEAR 4</text>
        <text x="50" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">Gold Medal</text>
        <text x="50" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rank 1 Topper</text>
      </g>
    </g>

    <!-- Felicitation Details & Institution Record -->
    <g transform="translate(30, 220)">
      <rect width="620" height="155" rx="10" fill="rgba(255, 215, 0, 0.04)" stroke="rgba(255, 215, 0, 0.2)"/>
      <g transform="translate(25, 25)">
        <text x="0" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">CMR Engineering College — B.Tech CSE (AI &amp; ML)</text>
        <text x="0" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffd700">Graduated with 93% Aggregate • Consecutive Gold Medalist All 4 Years</text>
        <text x="0" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#cbd5e1">Honored during the grand convocation felicitation ceremony alongside parents on the main stage.</text>
      </g>
      <line x1="25" y1="105" x2="595" y2="105" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(25, 120)">
        <text x="0" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Vignan Junior College</text>
        <text x="200" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#facc15">Intermediate — 98% Aggregate</text>
        <text x="450" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Academic Distinction</text>
      </g>
    </g>
  </g>
</svg>
